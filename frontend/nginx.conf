server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Безопасность (локально и на сервере; TLS — на внешнем балансировщике/certbot, см. G5.3).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Одна origin: API доступен по тем же адресам, что и сайт (CORS не нужен).
  # Справка об обучении — файл до 8 МБ в теле запроса.
  location = /pipeline/study-certificate {
    proxy_pass http://pipeline:8080;
    client_max_body_size 9m;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /pipeline {
    proxy_pass http://pipeline:8080;
    client_max_body_size 1m;
    # Один запрос может включать сборку паспорта (до ~4 мин) и аудит (до ~4 мин) подряд.
    proxy_read_timeout 900s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /support и /profile — одновременно страницы сайта и API (POST). Открытие страницы (GET/HEAD) отдаёт SPA,
  # иначе прямой заход или обновление страницы показывали JSON бэкенда.
  location = /support {
    if ($request_method ~ ^(GET|HEAD)$) { rewrite ^ /index.html last; }
    proxy_pass http://pipeline:8080;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
  }

  # ИИ-консультант (чат, стадия 5): ответ модели может идти долго.
  # Вход по коду из письма (регистрация, вход, сессия). Cookie сессии ходит через ту же origin.
  # API входа — только /auth/... (страница /auth — это SPA, её отдаёт location /).
  location /auth/ {
    proxy_pass http://pipeline:8080;
    client_max_body_size 16k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /chat {
    proxy_pass http://pipeline:8080;
    client_max_body_size 64k;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
  }

  # Данные основателя и справочник технологических вызовов (живой режим).
  location = /profile {
    if ($request_method ~ ^(GET|HEAD)$) { rewrite ^ /index.html last; }
    proxy_pass http://pipeline:8080;
    client_max_body_size 64k;
    proxy_set_header Host $host;
  }

  location /challenges {
    proxy_pass http://pipeline:8080;
    proxy_set_header Host $host;
  }

  # Выгрузка паспорта (POST /export) и скачивание (GET /export/:id).
  location /export {
    proxy_pass http://pipeline:8080;
    client_max_body_size 2m;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
  }

  # SPA: все маршруты отдают index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Статика с хешами — кэшировать долго.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
